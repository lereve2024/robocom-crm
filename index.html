   ========================================================== */
var PIN_SESSION_KEY = 'robocomcrm_pin';
var PIN_KEEP_KEY = 'robocomcrm_pin_keep';
var pinBuf = '';
var pinBusy = false;

function readSavedPin(){
  var keep = lsGet(PIN_KEEP_KEY);
  if (keep) return keep;
  var s = ssGet(PIN_SESSION_KEY);
  return s || null;
}
function storePin(pin, keep){
  ssSet(PIN_SESSION_KEY, pin);
  if (keep) lsSet(PIN_KEEP_KEY, pin);
  else lsDel(PIN_KEEP_KEY);
}
function clearPin(){
  ssDel(PIN_SESSION_KEY);
  lsDel(PIN_KEEP_KEY);
}
function paintDots(){
  var dots = document.querySelectorAll('#pinDots i');
  for (var i = 0; i < dots.length; i++) {
    dots[i].className = i < pinBuf.length ? 'on' : '';
  }
}
function pinError(msg){
  pinBusy = false;
  pinBuf = '';
  paintDots();
  var el = document.getElementById('pinMsg');
  if (el) { el.textContent = msg || '비밀번호가 맞지 않습니다'; el.classList.add('show'); }
  var lock = document.getElementById('lockScreen');
  lock.classList.remove('shake');
  void lock.offsetWidth;
  lock.classList.add('shake');
}
function pinPress(key){
  if (pinBusy) return;
  var msg = document.getElementById('pinMsg');
  if (msg) msg.classList.remove('show');

  if (key === 'del') { pinBuf = pinBuf.slice(0, -1); paintDots(); return; }
  if (key === 'reset') { pinBuf = ''; paintDots(); return; }
  if (!/^[0-9]$/.test(key)) return;
  if (pinBuf.length >= 4) return;

  pinBuf += key;
  paintDots();
  if (pinBuf.length === 4) attemptPin(pinBuf);
}

function attemptPin(pin){
  pinBusy = true;
  var dots = document.getElementById('pinDots');
  if (dots) dots.style.opacity = '.55';
  api.bootstrap(pin).then(function(boot){
    state.pin = pin;
    applyBoot(boot);
    storePin(pin, !!(document.getElementById('keepLogin') || {}).checked);
    pinBusy = false;
    if (dots) dots.style.opacity = '';
    pinBuf = '';
    paintDots();
    hideLock();
    render();
    toast('로보컴 CRM에 오신 것을 환영합니다');
  }).catch(function(err){
    if (dots) dots.style.opacity = '';
    pinError(err && err.message ? err.message : '비밀번호가 맞지 않습니다');
  });
}

function applyBoot(boot){
  state.orders = boot.orders || [];
  state.settlements = boot.settlements || [];
  state.expenses = boot.expenses || [];
  state.menu = boot.menu || MOCK_MENU;
  state.smsTemplates = boot.smsTemplates && boot.smsTemplates.length ? boot.smsTemplates : MOCK_SMS_TEMPLATES;
  state.sheetName = boot.sheetName || '';
  state.sheetUrl = boot.sheetUrl || '';
  state.companyName = boot.companyName || '로보컴';
  state.isDefaultPin = !!boot.isDefaultPin;
  state.demo = !serverAvailable();
  paintApiBadge();

  var today = todayStr();
  if (!state.calMonth) state.calMonth = today.slice(0, 7);
  if (!state.selDate) state.selDate = today;
  if (!state.stMonth) state.stMonth = today.slice(0, 7);

  document.getElementById('sideSheetName').textContent = state.sheetName || '구글 시트';
  var sheetLink = document.getElementById('sheetLinkSide');
  if (sheetLink) sheetLink.href = state.sheetUrl || '#';
  var sub = document.getElementById('topSub');
  if (sub) sub.textContent = state.demo ? '데모 데이터' : '실시간 시트 연동';
}

function hideLock(){
  document.getElementById('lockScreen').hidden = true;
  document.getElementById('shell').hidden = false;
}
function showLock(){
  state.pin = '';
  document.getElementById('lockScreen').hidden = false;
  document.getElementById('shell').hidden = true;
  pinBuf = '';
  paintDots();
}

function logout(){
  clearPin();
  state.pin = '';
  state.orders = [];
  state.openKey = null;
  closeDrawer();
  showLock();
  pinBuf = '';
  paintDots();
  var msg = document.getElementById('pinMsg');
  if (msg) msg.classList.remove('show');
  toast('로그아웃했어요');
  window.scrollTo(0, 0);
}

function refreshData(){
  api.bootstrap(state.pin).then(function(boot){
    applyBoot(boot);
    render();
    if (state.openKey) refreshDrawer();
    toast('시트에서 최신 데이터를 불러왔어요');
  }).catch(function(err){
    toast(err.message || '새로고침에 실패했어요', true);
  });
}

/* ==========================================================
   17. 이벤트
   ========================================================== */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');

  if (act === 'nav') { closeDrawer(); go(el.getAttribute('data-view')); return; }
  if (act === 'statusFilter') {
    state.statusFilter = el.getAttribute('data-val');
    document.getElementById('statusChips').innerHTML = statusChips();
    el.classList.add('active');
    refreshCustomerList();
    return;
  }
  if (act === 'ownerFilter') {
    state.ownerFilter = el.getAttribute('data-val');
    document.querySelectorAll('#ownerSeg button').forEach(function(b){ b.classList.remove('active'); });
    el.classList.add('active');
    document.getElementById('statusChips').innerHTML = statusChips();
    refreshCustomerList();
    return;
  }
  if (act === 'viewMode') {
    state.viewMode = el.getAttribute('data-val');
    document.querySelectorAll('#modeSeg button').forEach(function(b){ b.classList.remove('active'); });
    el.classList.add('active');
    refreshCustomerList();
    return;
  }
  if (act === 'clearQuery') {
    state.query = '';
    render();
    var s = document.getElementById('custSearch');
    if (s) s.focus();
    return;
  }
  if (act === 'openCustomer') { openDrawer(el.getAttribute('data-key')); return; }
  if (act === 'closeDrawer') { closeDrawer(); return; }
  if (act === 'newOrderForCustomer') {
    var ck = el.getAttribute('data-key');
    var c = customerByKey(ck);
    if (!c) return;
    openOrderModal({ prefill: {
      name: c.name, phone1: c.phone1, phone2: c.phone2, address: c.address,
      visitDate: todayStr(), calendar: '캘린더등록'
    }});
    return;
  }
  if (act === 'editOrder') {
    var id = el.getAttribute('data-id');
    var order = null;
    state.orders.forEach(function(o){ if (o.idKey === id) order = o; });
    if (order) openOrderModal({ order: order });
    return;
  }
  if (act === 'closeOrder') { closeOrderModal(); return; }
  if (act === 'sms') { openSmsModal(el.getAttribute('data-id')); return; }
  if (act === 'smsCustomer') {
    var key = el.getAttribute('data-key');
    var cu = customerByKey(key);
    if (cu && cu.orders.length) openSmsModal(cu.orders[0].idKey);
    return;
  }
  if (act === 'closeSms') { closeSmsModal(); return; }
  if (act === 'smsTpl') {
    var tid = el.getAttribute('data-id');
    var o = null;
    state.orders.forEach(function(x){ if (x.idKey === smsState.orderId) o = x; });
    var tpls = state.smsTemplates.length ? state.smsTemplates : MOCK_SMS_TEMPLATES;
    var tpl = tpls.filter(function(t){ return t.id === tid; })[0];
    if (!tpl || !o) return;
    smsState.tplId = tid;
    var text = fillTemplate(tpl.body, o);
    var ta = document.getElementById('smsText');
    if (ta) ta.value = text;
    updateSmsText(text);
    document.querySelectorAll('.sms-tpl').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-id') === tid);
    });
    return;
  }
  if (act === 'copySms') { copySms(); return; }
  if (act === 'copyAddress') {
    var c2 = customerByKey(el.getAttribute('data-key'));
    if (!c2 || !c2.address) { toast('저장된 주소가 없어요', true); return; }
    var txt = c2.address;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function(){ toast('주소를 복사했어요'); })
        .catch(function(){ toast('주소: ' + txt); });
    } else {
      toast('주소: ' + txt);
    }
    return;
  }
  if (act === 'setStatus') return; // select는 change 이벤트에서 처리
  if (act === 'setCal') {
    var idv = el.getAttribute('data-id');
    var val = el.getAttribute('data-val');
    if (!val || el.disabled) return;
    var patch = {};
    patch[act === 'setCal' ? 'calendar' : 'status'] = val;
    optimisticPatch(idv, patch);
    api.quickUpdate(state.pin, idv, patch).then(function(res){
      if (res && res.orders) state.orders = res.orders;
      render();
      if (state.openKey) refreshDrawer();
      toast(act === 'setCal' ? '캘린더 상태를 변경했어요' : '상태를 변경했어요');
    }).catch(function(err){
      toast(err.message || '변경에 실패했어요', true);
      refreshData();
    });
    return;
  }
  if (act === 'calMonth') {
    var delta = Number(el.getAttribute('data-delta'));
    if (!delta) return;
    state.calMonth = monthAdd(state.calMonth || todayStr().slice(0, 7), delta);
    var parts = state.calMonth.split('-');
    state.selDate = state.calMonth + '-01';
    render();
    return;
  }
  if (act === 'calToday') {
    state.calMonth = todayStr().slice(0, 7);
    state.selDate = todayStr();
    render();
    return;
  }
  if (act === 'pickDay') {
    state.selDate = el.getAttribute('data-date');
    render();
    return;
  }
  if (act === 'stTab') {
    state.stTab = el.getAttribute('data-val');
    render();
    return;
  }
  if (act === 'stMonth') {
    var d2 = Number(el.getAttribute('data-delta'));
    if (d2) state.stMonth = monthAdd(state.stMonth || todayStr().slice(0, 7), d2);
    else state.stMonth = todayStr().slice(0, 7);
    render();
    return;
  }
  if (act === 'openMenu') { openMenuModal(); return; }
  if (act === 'openSetup') { closeMenuModal(); openSetupModal(); return; }
  if (act === 'closeSetup') { closeSetupModal(); return; }
  if (act === 'saveApiUrl') { saveApiUrl(); return; }
  if (act === 'testApiUrl') { testApiUrl(); return; }
  if (act === 'demoMode') { startDemo(); return; }
  if (act === 'closeMenu') { closeMenuModal(); return; }
  if (act === 'refresh') { closeMenuModal(); refreshData(); return; }
  if (act === 'logout') { closeMenuModal(); logout(); return; }
  if (act === 'newOrder') { openOrderModal({}); return; }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (!el || !el.getAttribute) return;
  if (el.getAttribute('data-act') === 'setStatus') {
    var id = el.getAttribute('data-id');
    var val = el.value;
    if (!val) return;
    optimisticPatch(id, { status: val });
    api.quickUpdate(state.pin, id, { status: val }).then(function(res){
      if (res && res.orders) state.orders = res.orders;
      render();
      if (state.openKey) refreshDrawer();
      toast('상태를 ' + val + '(으)로 변경했어요');
    }).catch(function(err){
      toast(err.message || '변경에 실패했어요', true);
      refreshData();
    });
  }
});

document.addEventListener('submit', function(e){
  if (e.target && e.target.id === 'orderForm') {
    e.preventDefault();
    saveOrderForm(e.target);
  }
});

document.addEventListener('input', function(e){
  var el = e.target;
  if (!el || !el.id) return;
  if (el.id === 'custSearch') {
    state.query = el.value;
    refreshCustomerList();
    var clear = document.querySelector('.search .clear');
    if (state.query && !clear) {
      var b = document.createElement('button');
      b.className = 'clear';
      b.setAttribute('data-act', 'clearQuery');
      b.setAttribute('aria-label', '검색어 지우기');
      b.innerHTML = icon('x', 13);
      document.querySelector('.search').appendChild(b);
    } else if (!state.query && clear) {
      clear.remove();
    }
  }
  if (el.id === 'smsText') updateSmsText(el.value);
});

document.addEventListener('keydown', function(e){
  var lockVisible = !document.getElementById('lockScreen').hidden;
  if (lockVisible) {
    if (/^[0-9]$/.test(e.key)) { pinPress(e.key); return; }
    if (e.key === 'Backspace') { pinPress('del'); return; }
    if (e.key === 'Enter') { if (pinBuf.length === 4) attemptPin(pinBuf); return; }
  }
  if (e.key === 'Escape') {
    if (document.getElementById('orderModal').classList.contains('show')) { closeOrderModal(); return; }
    if (document.getElementById('smsModal').classList.contains('show')) { closeSmsModal(); return; }
    if (document.getElementById('menuModal').classList.contains('show')) { closeMenuModal(); return; }
    if (document.getElementById('setupModal').classList.contains('show')) { closeSetupModal(); return; }
    if (document.querySelector('.drawer.show')) { closeDrawer(); return; }
  }
});

document.getElementById('scrim').addEventListener('click', closeDrawer);
document.getElementById('fab').addEventListener('click', function(){ openOrderModal({}); });
document.getElementById('keypad').addEventListener('click', function(e){
  var b = e.target.closest('[data-key]');
  if (b) pinPress(b.getAttribute('data-key'));
});
document.getElementById('mobileMenu').addEventListener('click', openMenuModal);
document.getElementById('logoutSide').addEventListener('click', logout);
document.getElementById('sheetLinkSide').addEventListener('click', function(e){
  if (!state.sheetUrl) { e.preventDefault(); toast('시트 주소를 불러오지 못했어요', true); }
});
document.getElementById('sideUser').addEventListener('click', openMenuModal);

['orderModal', 'smsModal', 'menuModal', 'setupModal'].forEach(function(id){
  var w = document.getElementById(id);
  w.addEventListener('click', function(e){
    if (e.target === w) {
      if (id === 'orderModal') closeOrderModal();
      if (id === 'smsModal') closeSmsModal();
      if (id === 'menuModal') closeMenuModal();
    }
  });
});

function optimisticPatch(id, patch){
  state.orders.forEach(function(o){
    if (o.idKey === id) Object.keys(patch).forEach(function(k){ o[k] = patch[k]; });
  });
  var view = document.getElementById('view');
  if (view && state.pin) view.innerHTML = renderView();
}
function refreshCustomerList(){
  var box = document.getElementById('custResults');
  if (box) box.innerHTML = renderCustomerResults();
}

/* ==========================================================
   18. 시작
   ========================================================== */
(function boot(){
  bootApp();
})();

/** 앱 시작 — 서버 주소 확인 → 자동 로그인 → 잠금 화면 */
function bootApp(){
  HAS_SERVER = serverAvailable();   // 주소 설정 여부로 판단
  state.demo = !HAS_SERVER;
  var keepEl = document.getElementById('keepLogin');
  if (keepEl) keepEl.checked = !!lsGet(PIN_KEEP_KEY);
  paintDots();
  paintApiBadge();

  // 서버 주소가 없으면 먼저 설정 화면을 띄웁니다
  if (!HAS_SERVER) {
    showLock();
    openSetupModal({ first: true });
    return;
  }

  var saved = readSavedPin();
  if (!saved) { showLock(); return; }
  // 자동 로그인 시도
  api.bootstrap(saved).then(function(bootData){
    state.pin = saved;
    applyBoot(bootData);
    hideLock();
    render();
  }).catch(function(){
    clearPin();
    showLock();
  });
}

/* 서비스 워커 — 홈 화면 앱(PWA)으로 쓸 때 화면 파일을 빠르게 열어 줍니다 */
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && typeof location !== 'undefined' && location.protocol === 'https:') {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

</script>
