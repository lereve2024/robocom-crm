<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5bff">
<title>로보컴 CRM</title>

<!-- 홈 화면에 추가했을 때 주소창 없는 앱으로 열리게 하는 설정 (PWA) -->
<meta name="description" content="로보컴 고객·주문·정산 관리">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="로보컴 CRM">
<meta name="application-name" content="로보컴 CRM">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<style>
/* ==========================================================
   로보컴 CRM — 디자인 시스템 (외부 CDN 없이 단독 동작)
   ========================================================== */
:root{
  --brand:#2f5bff;
  --brand-600:#2447d8;
  --brand-700:#1c37ab;
  --brand-soft:#eef2ff;
  --brand-soft-2:#e4eaff;

  --ink:#0f1728;
  --ink-2:#3b465a;
  --muted:#7b8698;
  --muted-2:#98a2b3;

  --bg:#f4f6fb;
  --card:#ffffff;
  --line:#e9edf5;
  --line-2:#dee4ef;

  --wait:#f59e0b;   --wait-soft:#fff6e6;
  --prog:#2f5bff;   --prog-soft:#eef2ff;
  --done:#0ea472;   --done-soft:#e9f8f1;
  --cancel:#8a94a6; --cancel-soft:#f1f4f9;
  --due:#ef4444;    --due-soft:#fdeeee;
  --violet:#7c5cff; --violet-soft:#f1edff;

  --radius:18px;
  --radius-sm:13px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -18px rgba(16,24,40,.45);
  --shadow-md:0 2px 6px rgba(16,24,40,.06), 0 18px 40px -24px rgba(16,24,40,.45);
  --shadow-lg:0 24px 70px -30px rgba(16,24,40,.5);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", "Malgun Gothic", system-ui, "Segoe UI", sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.45;
  letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
[hidden]{display:none !important}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
input,textarea,select{-webkit-appearance:none;appearance:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d8dee9;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}
svg{display:block}
.icon{flex:0 0 auto;display:inline-block;vertical-align:-3px}
.sep{display:inline-block;width:3px;height:3px;border-radius:99px;background:#c9d0dc;vertical-align:middle;margin:0 1px}

/* ---------- 공통 컴포넌트 ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-xs);
}
.card-pad{padding:16px}
.muted{color:var(--muted)}
.tiny{font-size:11.5px;line-height:1.35}
.small{font-size:12.5px}
.strong{font-weight:700}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.grow{flex:1 1 auto;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  height:23px;padding:0 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap;
  background:var(--cancel-soft);color:var(--ink-2);
}
.pill .dot{width:5px;height:5px;border-radius:99px;background:currentColor;opacity:.9}
.pill-wait{background:var(--wait-soft);color:#b45309}
.pill-prog{background:var(--prog-soft);color:var(--brand-600)}
.pill-done{background:var(--done-soft);color:#067a55}
.pill-cancel{background:var(--cancel-soft);color:#64707f}
.pill-due{background:var(--due-soft);color:#c22b2b}
.pill-violet{background:var(--violet-soft);color:#5b3fd6}
.pill-neutral{background:#f4f6fa;color:#66707f}

.avatar{
  width:44px;height:44px;border-radius:999px;flex:0 0 auto;
  display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:-0.02em;
  background:var(--brand-soft);color:var(--brand-600);
  border:1px solid rgba(47,91,255,.08);
}
.avatar.sm{width:30px;height:30px;font-size:12px}
.avatar.lg{width:62px;height:62px;font-size:20px}
.av-0{background:#eef2ff;color:#2f5bff}
.av-1{background:#e9f8f1;color:#0b8a61}
.av-2{background:#fff6e6;color:#a86500}
.av-3{background:#f1edff;color:#6244d8}
.av-4{background:#fdeeee;color:#c93b3b}
.av-5{background:#e8f6fb;color:#0b7b9c}
.av-6{background:#fdf0f7;color:#b3357d}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:42px;padding:0 16px;border-radius:12px;
  font-size:13.5px;font-weight:700;letter-spacing:-0.01em;
  background:#fff;border:1px solid var(--line-2);color:var(--ink-2);
  transition:transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:#cfd8e6;background:#fbfcfe}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 10px 22px -12px rgba(47,91,255,.9)}
.btn-primary:hover{background:var(--brand-600);border-color:var(--brand-600)}
.btn-soft{background:var(--brand-soft);border-color:transparent;color:var(--brand-600)}
.btn-soft:hover{background:var(--brand-soft-2);border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:#eef1f7;color:var(--ink-2)}
.btn-sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:11px}
.btn-danger{color:#c22b2b;border-color:#f3d3d3;background:#fff}
.btn:disabled{opacity:.5;pointer-events:none}

.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:-0.01em}
.input,.select,.textarea{
  width:100%;border:1px solid var(--line-2);background:#fff;border-radius:11px;
  padding:10px 12px;font-size:14px;line-height:1.4;color:var(--ink);
  transition:border-color .15s ease, box-shadow .15s ease;outline:none;
}
.input::placeholder,.textarea::placeholder{color:#a8b1bf}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,255,.13)}
.select{
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%237b8698' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m4 6 4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;
}
.textarea{min-height:76px;resize:vertical}
.input[type="date"]{min-height:42px}
.input[type="date"]::-webkit-calendar-picker-indicator{opacity:.5}
input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}

.search{
  display:flex;align-items:center;gap:9px;height:46px;padding:0 14px;
  background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-xs);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.search:focus-within{border-color:#c3d0ff;box-shadow:0 0 0 3px rgba(47,91,255,.10)}
.search input{border:0;outline:0;background:transparent;flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:500}
.search .clear{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;background:#eef1f7;color:var(--muted)}

.chip{
  height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--ink-2);font-size:12.5px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:all .15s ease;box-shadow:var(--shadow-xs);
}
.chip .cnt{font-size:11px;font-weight:700;color:var(--muted-2)}
.chip:hover{border-color:#cfd8e6}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 8px 18px -12px rgba(15,23,40,.9)}
.chip.active .cnt{color:rgba(255,255,255,.72)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

.seg{display:inline-flex;background:#eef1f7;border-radius:11px;padding:3px;gap:2px}
.seg button{
  height:30px;padding:0 11px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);
  display:inline-flex;align-items:center;gap:5px;transition:all .15s ease;
}
.seg button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}

.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:38px 18px;text-align:center;color:var(--muted);
}
.empty .ic{width:46px;height:46px;border-radius:14px;background:#f1f4fa;display:grid;place-items:center;color:#a5aebe}
.empty .t{font-size:13px;font-weight:700;color:var(--ink-2)}
.empty .s{font-size:12px}

/* ---------- 화면 골격 ---------- */
.app{min-height:100dvh}
.shell{min-height:100dvh;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  height:calc(56px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 14px 0;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid rgba(233,237,245,.9);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  width:32px;height:32px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(140deg,#4b74ff,#2440d0);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 14px -8px rgba(47,91,255,.9);
}
.brand-name{font-size:15.5px;font-weight:800;letter-spacing:-0.03em}
.brand-sub{font-size:10.5px;font-weight:700;color:var(--muted-2);letter-spacing:.02em}

.main{flex:1 1 auto;width:100%;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
.view{width:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.93);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid rgba(226,232,242,.9);
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:52px;border-radius:13px;color:#8a94a6;font-size:10.5px;font-weight:700;letter-spacing:-0.01em;
  transition:color .15s ease, background .15s ease;
}
.tabbar button svg{width:22px;height:22px}
.tabbar button.active{color:var(--brand)}
.tabbar button.active .tab-ico{background:var(--brand-soft)}
.tab-ico{display:grid;place-items:center;width:40px;height:26px;border-radius:999px;transition:background .15s ease}

.fab{
  position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:45;
  width:54px;height:54px;border-radius:999px;
  background:linear-gradient(150deg,#4a72ff,#2141cf);color:#fff;
  display:grid;place-items:center;
  box-shadow:0 16px 30px -14px rgba(37,72,220,.85), 0 2px 6px rgba(16,24,40,.12);
  transition:transform .14s ease, box-shadow .14s ease;
}
.fab:active{transform:scale(.94)}
.fab:hover{box-shadow:0 20px 36px -14px rgba(37,72,220,.9)}

/* ---------- 화면 헤더 ---------- */
.page-head{display:flex;flex-direction:column;gap:4px;padding:4px 2px 2px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.035em;line-height:1.25}
.page-sub{font-size:12.5px;color:var(--muted);font-weight:500}
.page-tools{display:flex;align-items:center;gap:8px}

.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.sec-title{font-size:14.5px;font-weight:800;letter-spacing:-0.025em;display:flex;align-items:center;gap:7px}
.sec-title .n{font-size:12px;font-weight:700;color:var(--brand-600);background:var(--brand-soft);padding:1px 7px;border-radius:99px}
.link-more{font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:2px}

/* ---------- 대시보드 ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#2447d8 0%,#2f5bff 46%,#4b76ff 100%);
  border-radius:22px;padding:20px;color:#fff;
  box-shadow:0 24px 50px -28px rgba(36,71,216,.95);
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-70px;width:210px;height:210px;border-radius:999px;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.32), rgba(255,255,255,0) 68%);
}
.hero::before{
  content:"";position:absolute;right:34px;bottom:-90px;width:180px;height:180px;border-radius:999px;
  border:26px solid rgba(255,255,255,.08);
}
.hero .h-eyebrow{font-size:11.5px;font-weight:700;opacity:.82;letter-spacing:.01em}
.hero .h-title{font-size:20px;font-weight:800;letter-spacing:-0.03em;margin-top:5px;line-height:1.3}
.hero .h-title b{font-weight:800}
.hero .h-row{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.hero .h-stat{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);
  border-radius:12px;padding:8px 11px;display:flex;flex-direction:column;gap:1px;min-width:0;
}
.hero .h-stat .l{font-size:10.5px;font-weight:700;opacity:.8}
.hero .h-stat .v{font-size:14px;font-weight:800;letter-spacing:-0.02em}

.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;
  display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow-xs);position:relative;overflow:hidden;
}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .k-label{font-size:11.5px;font-weight:700;color:var(--muted)}
.kpi .k-ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:#f3f6fc;color:#7d8aa0}
.kpi .k-val{font-size:21px;font-weight:800;letter-spacing:-0.045em;line-height:1.15}
.kpi .k-val small{font-size:11.5px;font-weight:700;letter-spacing:-0.01em;color:var(--muted);margin-left:1.5px}
.kpi .k-sub{font-size:11px;font-weight:600;color:var(--muted-2);display:flex;align-items:center;gap:4px}
.kpi .k-sub.up{color:#0b8a61}
.kpi .k-sub.down{color:#c22b2b}
.kpi.accent{background:linear-gradient(160deg,#f7f9ff,#eef2ff);border-color:#dfe6ff}
.kpi.accent .k-ic{background:#fff;color:var(--brand)}
.kpi.due .k-val{color:#d92d20}

.hbar{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.hbar-row{display:flex;align-items:center;gap:10px}
.hbar-m{width:34px;flex:0 0 auto;font-size:11px;font-weight:700;color:var(--muted-2)}
.hbar-track{flex:1 1 auto;height:9px;border-radius:99px;background:#f1f4fa;overflow:hidden}
.hbar-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c6d5ff,#7f9dff)}
.hbar-track i.now{background:linear-gradient(90deg,#8fb0ff,#2f5bff)}
.hbar-v{width:76px;flex:0 0 auto;text-align:right;font-size:11.5px;font-weight:800;letter-spacing:-0.02em;color:var(--ink-2)}
.hbar-v.zero{color:var(--muted-2);font-weight:600}

.visit{
  display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line);
}
.visit:first-of-type{border-top:0;padding-top:2px}
.visit .date-chip{
  width:44px;flex:0 0 auto;border-radius:11px;background:#f5f7fc;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:5px 0;
}
.visit .date-chip .d{font-size:15px;font-weight:800;letter-spacing:-0.03em;line-height:1.1}
.visit .date-chip .w{font-size:9.5px;font-weight:700;color:var(--muted-2)}
.visit.today .date-chip{background:var(--brand);border-color:var(--brand);color:#fff}
.visit.today .date-chip .w{color:rgba(255,255,255,.8)}
.visit .v-name{font-size:13.5px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:6px}
.visit .v-meta{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:5px;flex-wrap:nowrap;min-width:0}
.visit .sep{width:3px;height:3px;border-radius:99px;background:#c9d0dc;display:inline-block;vertical-align:middle}
.dash-two{display:flex;flex-direction:column;gap:14px}
@media (min-width:980px){ .dash-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start} }
.iconbtn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line);color:#6d7889;flex:0 0 auto;
  transition:all .15s ease;
}
.iconbtn:hover{background:#f7f9fd;border-color:#cfd8e6;color:var(--ink-2)}
.iconbtn.primary{background:var(--brand-soft);border-color:transparent;color:var(--brand-600)}
.iconbtn.primary:hover{background:var(--brand-soft-2)}

.team-card{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.team-card:first-of-type{border-top:0;padding-top:0}
.team-card .t-name{font-size:13px;font-weight:800}
.team-card .t-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.team-card .t-amt{font-size:13px;font-weight:800;letter-spacing:-0.03em;text-align:right}
.team-card .t-amtl{font-size:10.5px;font-weight:700;color:var(--muted-2);text-align:right}

.list-row{
  display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line);
  width:100%;text-align:left;
}
.list-row:first-of-type{border-top:0;padding-top:2px}
.list-row .lr-t{font-size:13px;font-weight:700;letter-spacing:-0.02em}
.list-row .lr-s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- 고객 ---------- */
.cust{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;
  box-shadow:var(--shadow-xs);transition:border-color .15s ease, transform .12s ease, box-shadow .15s ease;
}
.cust:hover{border-color:#cfd9ea;box-shadow:var(--shadow-sm)}
.cust:active{transform:scale(.995)}
.cust .c-name{font-size:14.5px;font-weight:800;letter-spacing:-0.025em;display:flex;align-items:center;gap:6px}
.cust .c-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:nowrap;min-width:0}
.cust .c-right{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cust .c-amt{font-size:13.5px;font-weight:800;letter-spacing:-0.03em}
.cust .c-when{font-size:10.5px;color:var(--muted-2);font-weight:600}
.cust-list{display:flex;flex-direction:column;gap:9px}
@media (min-width:980px){ .cust-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start} }

.board{display:flex;gap:11px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.board-col{
  flex:1 0 265px;min-width:265px;background:#f7f9fd;border:1px solid var(--line);
  border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;
}
.board-col .bc-head{display:flex;align-items:center;gap:7px;padding:2px 4px 4px}
.board-col .bc-title{font-size:12.5px;font-weight:800;letter-spacing:-0.02em}
.board-col .bc-n{font-size:11px;font-weight:800;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 7px}
.bcard{
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:left;width:100%;
  box-shadow:var(--shadow-xs);transition:border-color .15s ease, transform .12s ease;
}
.bcard:hover{border-color:#cfd9ea;transform:translateY(-1px)}
.bcard .b-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bcard .b-name{font-size:13px;font-weight:800;letter-spacing:-0.02em}
.bcard .b-sub{font-size:11px;color:var(--muted);margin-top:3px}
.bcard .b-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px dashed #edf0f6}
.bcard .b-amt{font-size:12.5px;font-weight:800;letter-spacing:-0.03em}
.bcard .b-date{font-size:10.5px;color:var(--muted-2);font-weight:600}
.board-empty{padding:18px 8px;text-align:center;font-size:11.5px;color:var(--muted-2)}

/* ---------- 고객 상세 드로어 ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(15,23,40,.42);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;z-index:55;background:#fff;display:flex;flex-direction:column;
  inset:0;transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  visibility:hidden;
}
.drawer.show{transform:none;visibility:visible}
.drawer-head{
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);
  display:flex;flex-direction:column;gap:12px;flex:0 0 auto;
}
.drawer-body{flex:1 1 auto;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.drawer-foot{
  flex:0 0 auto;padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:#fff;display:flex;gap:8px;
  box-shadow:0 -8px 20px -18px rgba(16,24,40,.5);
}
.d-head-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.d-person{display:flex;align-items:center;gap:12px}
.d-name{font-size:18px;font-weight:800;letter-spacing:-0.035em}
.d-phone{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.d-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.d-act{
  height:38px;border-radius:11px;background:#f7f9fd;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2);
}
.d-act:hover{background:#eef2fa}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.d-stat{background:#f8fafe;border:1px solid var(--line);border-radius:13px;padding:10px}
.d-stat .l{font-size:10.5px;font-weight:700;color:var(--muted-2)}
.d-stat .v{font-size:14px;font-weight:800;letter-spacing:-0.03em;margin-top:2px}

.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,#e6ebf5,#f2f5fa)}
.tl-item{position:relative;margin-bottom:11px}
.tl-item::before{
  content:"";position:absolute;left:-19px;top:16px;width:10px;height:10px;border-radius:99px;
  background:#fff;border:2.5px solid #c9d4e8;
}
.tl-item.now::before{border-color:var(--brand);box-shadow:0 0 0 4px rgba(47,91,255,.12)}
.tl-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow-xs)}
.tl-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.tl-date{font-size:11.5px;font-weight:800;color:var(--ink-2);letter-spacing:-0.01em}
.tl-title{font-size:13px;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-model{font-size:11.5px;color:var(--muted);margin-top:3px}
.tl-body{font-size:12.5px;color:var(--ink-2);margin-top:7px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.tl-kv{display:flex;gap:6px;margin-top:7px;align-items:flex-start}
.tl-kv .k{font-size:11px;font-weight:800;color:var(--muted-2);flex:0 0 auto;padding-top:1px;min-width:40px}
.tl-kv .v{font-size:12px;color:var(--ink-2);word-break:break-word}
.tl-money{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:9px;border-top:1px dashed #edf0f6}
.tl-amt{font-size:14px;font-weight:800;letter-spacing:-0.035em}
.tl-memo{
  margin-top:8px;background:#fffaf0;border:1px solid #f7e6bd;border-radius:10px;
  padding:8px 10px;font-size:11.5px;color:#8a6100;display:flex;gap:6px;
}
.tl-foot{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.mini-select{
  height:30px;border:1px solid var(--line-2);border-radius:9px;background:#fff;
  font-size:11.5px;font-weight:700;padding:0 24px 0 9px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%237b8698' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m4 5 3 3 3-3'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 6px center;
}

/* ---------- 일정 ---------- */
.cal-card{padding:14px 12px 12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-month{font-size:16px;font-weight:800;letter-spacing:-0.03em;display:flex;align-items:baseline;gap:6px}
.cal-month small{font-size:11.5px;font-weight:700;color:var(--muted-2)}
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cal-legend span{font-size:10.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.cal-legend i{width:6px;height:6px;border-radius:99px;display:inline-block}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-dow span{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted-2);padding:2px 0}
.cal-dow span:first-child{color:#e07a7a}
.cal-dow span:last-child{color:#6f8fd8}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{
  position:relative;height:48px;border-radius:11px;padding:4px 2px 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;background:transparent;
  transition:background .12s ease;border:1px solid transparent;
}
.cal-day:hover{background:#f4f7fd}
.cal-day .dn{font-size:12px;font-weight:700;color:var(--ink-2);line-height:1.5;width:24px;height:24px;display:grid;place-items:center;border-radius:99px}
.cal-day.sun .dn{color:#dc5b5b}
.cal-day.sat .dn{color:#5b7fd0}
.cal-day.out .dn{color:#c5ccd8;font-weight:600}
.cal-day.today .dn{background:var(--brand-soft);color:var(--brand-600);font-weight:800}
.cal-day.sel{background:var(--brand);border-color:var(--brand)}
.cal-day.sel .dn{background:transparent;color:#fff}
.cal-day.sel .dots i{background:rgba(255,255,255,.9)}
.cal-day .dots{display:flex;gap:2.5px;align-items:center;height:6px;flex-wrap:wrap;justify-content:center;max-width:30px}
.cal-day .dots i{width:5px;height:5px;border-radius:99px;background:#c8d2e4;display:block}
.cal-day .cnt{position:absolute;top:2px;right:2px;font-size:8.5px;font-weight:800;color:var(--muted-2)}
.cal-day.sel .cnt{color:rgba(255,255,255,.85)}
.cal-day .dots i.s-wait{background:var(--wait)}
.cal-day .dots i.s-prog{background:var(--prog)}
.cal-day .dots i.s-done{background:var(--done)}
.cal-day .dots i.s-cancel{background:var(--cancel)}

.visit-sched{
  display:flex;flex-direction:column;gap:9px;
}
.vs-card{
  background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;
  box-shadow:var(--shadow-xs);display:flex;flex-direction:column;gap:9px;
}
.vs-top{display:flex;align-items:flex-start;gap:10px}
.vs-name{font-size:13.5px;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vs-sub{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:keep-all}
.vs-tags{display:flex;gap:5px;flex-wrap:wrap}
.vs-steps{display:flex;gap:4px;background:#f5f7fc;border-radius:10px;padding:3px}
.vs-steps button{
  flex:1 1 0;height:28px;border-radius:8px;font-size:10.5px;font-weight:700;color:var(--muted);
  white-space:nowrap;transition:all .15s ease;
}
.vs-steps button:hover{background:#eaeef7;color:var(--ink-2)}
.vs-steps button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}
.vs-steps button.active[data-cal="캘린더등록"]{color:#5b3fd6}
.vs-steps button.active[data-cal="방문완료"]{color:#067a55}
.vs-steps button.active[data-cal="미방문"]{color:#b45309}

/* ---------- 정산 ---------- */
.money-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.money{
  background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 13px;box-shadow:var(--shadow-xs);
}
.money .l{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px}
.money .v{font-size:17px;font-weight:800;letter-spacing:-0.04em;margin-top:5px}
.money .v small{font-size:11px;font-weight:700;color:var(--muted-2);margin-left:2px}
.money.hero-money{grid-column:1 / -1;background:linear-gradient(160deg,#0f1728,#1c2b4a);color:#fff;border-color:#1c2b4a}
.money.hero-money .l{color:rgba(255,255,255,.7)}
.money.hero-money .v{font-size:24px;color:#fff}
.money.hero-money .v small{color:rgba(255,255,255,.6)}

.st-row{
  display:flex;flex-direction:column;gap:7px;padding:12px;border-radius:14px;background:#fff;
  border:1px solid var(--line);box-shadow:var(--shadow-xs);
}
.st-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st-name{font-size:13px;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:6px}
.st-date{font-size:11px;color:var(--muted-2);font-weight:600}
.st-amount{font-size:15px;font-weight:800;letter-spacing:-0.04em}
.st-bars{display:flex;height:6px;border-radius:99px;overflow:hidden;background:#f0f3f9}
.st-bars i{display:block;height:100%}
.st-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.st-meta .lbl{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.st-list{display:flex;flex-direction:column;gap:8px}
.exp-row{
  display:flex;align-items:center;gap:11px;padding:11px 12px;background:#fff;border:1px solid var(--line);
  border-radius:13px;box-shadow:var(--shadow-xs);
}
.exp-row .e-date{font-size:11.5px;font-weight:700;color:var(--muted-2);width:48px;flex:0 0 auto}
.exp-row .e-item{font-size:12.5px;font-weight:700;letter-spacing:-0.01em}
.exp-row .e-amt{font-size:13px;font-weight:800;letter-spacing:-0.03em;text-align:right}

/* ---------- 모달 ---------- */
.modal-wrap{
  position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(15,23,40,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.modal-wrap.show{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-height:94dvh;background:#fff;border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(24px);transition:transform .24s cubic-bezier(.32,.72,0,1);
  box-shadow:var(--shadow-lg);
}
.modal-wrap.show .sheet{transform:none}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.sheet-title{font-size:16px;font-weight:800;letter-spacing:-0.03em}
.sheet-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.sheet-body{overflow-y:auto;padding:16px;flex:1 1 auto}
.sheet-foot{
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;gap:8px;flex:0 0 auto;background:#fff;
}
.sheet-foot .btn{flex:1 1 0;height:46px;border-radius:13px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-grid .full{grid-column:1 / -1}
.form-sec{font-size:11.5px;font-weight:800;color:var(--muted-2);letter-spacing:.04em;margin:6px 0 -2px}
.form-sec:first-child{margin-top:0}
.hint{font-size:11px;color:var(--muted-2);line-height:1.5}

/* 문자 */
.sms-templates{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sms-templates::-webkit-scrollbar{display:none}
.sms-tpl{
  flex:0 0 auto;padding:9px 11px;border-radius:12px;border:1px solid var(--line);
  background:#fff;text-align:left;min-width:132px;transition:all .15s ease;
}
.sms-tpl .n{font-size:11px;font-weight:800;color:var(--muted-2)}
.sms-tpl .t{font-size:12px;font-weight:700;margin-top:3px;letter-spacing:-0.02em;line-height:1.3}
.sms-tpl.active{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(47,91,255,.08)}
.sms-tpl.active .n{color:var(--brand-600)}
.sms-preview{
  border:1px solid var(--line-2);border-radius:14px;background:#fbfcfe;padding:2px;
}
.sms-preview textarea{
  width:100%;border:0;background:transparent;padding:12px;font-size:13px;line-height:1.6;
  min-height:172px;resize:vertical;outline:none;color:var(--ink);
}
.sms-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted-2);padding:0 4px}
.sms-vars{display:flex;gap:5px;flex-wrap:wrap}
.sms-var{
  font-size:11px;font-weight:700;color:var(--brand-600);background:var(--brand-soft);
  border-radius:7px;padding:3px 7px;border:1px solid transparent;
}
.sms-var:hover{background:var(--brand-soft-2)}

/* 토스트 */
.toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:90;background:#0f1728;color:#fff;border-radius:12px;padding:10px 15px;
  font-size:12.5px;font-weight:700;letter-spacing:-0.01em;box-shadow:0 16px 34px -16px rgba(15,23,40,.7);
  opacity:0;pointer-events:none;transition:all .22s ease;max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#c22b2b}

/* PIN 잠금 */
.lock{
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;overflow-y:auto;
  background:
    radial-gradient(900px 420px at 50% -10%, #e7edff 0%, rgba(231,237,255,0) 62%),
    radial-gradient(700px 380px at 100% 110%, #eaf6f0 0%, rgba(234,246,240,0) 60%),
    #f4f6fb;
}
.lock-inner{width:100%;max-width:332px;display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto 0}
.lock-mark{
  width:62px;height:62px;border-radius:19px;background:linear-gradient(140deg,#4b74ff,#2440d0);
  display:grid;place-items:center;color:#fff;box-shadow:0 18px 34px -16px rgba(47,91,255,.9);
}
.lock h1{font-size:22px;font-weight:800;letter-spacing:-0.04em;margin-top:14px}
.lock .sub{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:500}
.pin-dots{display:flex;gap:14px;margin:24px 0 6px}
.pin-dots i{
  width:13px;height:13px;border-radius:99px;background:#fff;border:1.8px solid #ccd5e4;
  transition:all .15s ease;display:block;
}
.pin-dots i.on{background:var(--brand);border-color:var(--brand);transform:scale(1.12)}
.pin-msg{height:18px;font-size:11.5px;font-weight:700;color:var(--due);opacity:0;transition:opacity .15s ease}
.pin-msg.show{opacity:1}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;margin-top:12px}
.keypad button{
  height:60px;border-radius:17px;background:#fff;border:1px solid var(--line);
  font-size:22px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);
  box-shadow:var(--shadow-xs);transition:all .12s ease;
  display:grid;place-items:center;
}
.keypad button:hover{background:#f7f9fe;border-color:#d5ddea}
.keypad button:active{transform:scale(.96);background:var(--brand-soft)}
.keypad button.fn{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.keypad button.fn:hover{background:#eef1f7}
.keypad button.fn:active{background:#e7ebf3}
.lock-foot{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.keep{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
.keep input{width:15px;height:15px;border-radius:4px;border:1.5px solid #cbd4e2;background:#fff;display:grid;place-items:center;appearance:none;position:relative}
.keep input:checked{background:var(--brand);border-color:var(--brand)}
.keep input:checked::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.lock-note{font-size:10.5px;color:#a8b1bf;line-height:1.5;max-width:280px}
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}

/* 스켈레톤 */
.skel{background:linear-gradient(90deg,#eef1f7 25%,#f6f8fc 37%,#eef1f7 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite;border-radius:12px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

/* PC */
@media (min-width: 980px){
  .shell{flex-direction:row}
  .topbar,.tabbar{display:none}
  .fab{right:34px;bottom:30px;width:58px;height:58px}
  .main{margin-left:258px;padding:30px 34px 60px;width:auto;flex:1 1 auto;min-width:0}
  .view{gap:16px}
  .page-title{font-size:26px}
  .kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .hero{padding:24px 26px;border-radius:24px}
  .hero .h-title{font-size:23px}
  .money-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .money.hero-money{grid-column:auto}
  .money.hero-money .v{font-size:20px}
  .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
  .board-col{flex:1 1 auto;min-width:0}
  .drawer{
    inset:auto 0 0 auto;top:0;height:100dvh;width:500px;

function icon(name, size, cls){

var TZ_OFFSET = 9 * 3600 * 1000;

function pad2(n){ n = String(n); return n.length < 2 ? '0' + n : n; }
function todayStr(){
  return new Date(Date.now() + TZ_OFFSET).toISOString().slice(0, 10);
}
function parseYmd(s){
  if (!s) return null;
  var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b){ return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }

var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
function weekOf(s){ var d = parseYmd(s); return d ? WEEK[d.getDay()] : ''; }
function dateLabel(s){
  var d = parseYmd(s);
  if (!d) return s || '—';
  return (d.getMonth() + 1) + '/' + d.getDate() + ' (' + WEEK[d.getDay()] + ')';
}
function dateLong(s){
  var d = parseYmd(s);
  if (!d) return s || '—';
  return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')';
}
function monthLabel(m){ // 'YYYY-MM'
  var p = String(m).split('-');
  return p[0] + '년 ' + Number(p[1]) + '월';
}
function relLabel(s){
  if (!s) return '—';
  var diff = daysBetween(todayStr(), s);
  if (diff === 0) return '오늘';
  if (diff === 1) return '내일';
  if (diff === 2) return '모레';
  if (diff === -1) return '어제';
  if (diff > 0 && diff < 7) return diff + '일 뒤';
  if (diff < 0) return Math.abs(diff) + '일 전';
  return dateLabel(s);
}

function digits(s){ return String(s || '').replace(/[^0-9]/g, ''); }
function won(n){
  n = Number(n || 0);
  return n.toLocaleString('ko-KR') + '원';
}
function wonShort(n){
  n = Number(n || 0);
  if (n >= 100000000) return (Math.round(n / 10000000) / 10) + '억';
  if (n >= 10000) {
    var man = n / 10000;
    return (man >= 100 ? Math.round(man) : (Math.round(man * 10) / 10)) + '만';
  }
  return n.toLocaleString('ko-KR');
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

}
function nl2br(s){ return esc(s).replace(/\n/g, '<br>'); }

var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function toChosung(str){
  var out = '';
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c >= 0xAC00 && c <= 0xD7A3) out += CHO[Math.floor((c - 0xAC00) / 588)];
    else out += str.charAt(i);
  }
  return out;
}
function chosungRegex(q){
  var out = '';
  for (var i = 0; i < q.length; i++) {
    var ch = q.charAt(i);
    var idx = CHO.indexOf(ch);
    if (idx >= 0) {

      out += '[' + String.fromCharCode(s) + '-' + String.fromCharCode(s + 587) + ']';
    } else {
      out += ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
  }
  return new RegExp(out, 'i');
}

function avatarClass(key){
  var h = 0;
  key = String(key || '');
  for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) % 997;
  return 'av-' + (h % 7);
}
function initial(name){
  name = String(name || '').trim();

  return name.slice(0, 1).toUpperCase();
}

   · 주소는 아래 GAS_API_URL 상수에 박아 두거나,

/** ★ 배포 후 여기에 Apps Script 웹앱 주소를 넣으면 설정 화면 없이 바로 열립니다.
 *    예) var GAS_API_URL = 'https://script.google.com/macros/s/AKfycb..../exec'; */
var GAS_API_URL = '';

var API_URL_KEY = 'robocomcrm_api_url';

function normalizeApiUrl(u){
  u = String(u == null ? '' : u).trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
function isValidApiUrl(u){
  return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_\-]+\/exec\/?$/i.test(normalizeApiUrl(u));
}
function savedApiUrl(){ return normalizeApiUrl(lsGet(API_URL_KEY) || ''); }
function apiUrl(){
  var injected = (typeof window !== 'undefined' && window.ROBOCOM_API_URL) ? window.ROBOCOM_API_URL : '';
  return normalizeApiUrl(injected) || normalizeApiUrl(GAS_API_URL) || savedApiUrl();
}
function setApiUrl(u){
  u = normalizeApiUrl(u);
  if (!u) { lsDel(API_URL_KEY); return ''; }
  lsSet(API_URL_KEY, u);
  return u;
}
function shortApiUrl(u){
  u = normalizeApiUrl(u);
  if (!u) return '';
  var m = u.match(/\/macros\/s\/([A-Za-z0-9_\-]+)/);
  if (m) return '…/s/' + m[1].slice(0, 6) + '…/exec';
  return u.replace(/^https?:\/\//, '').slice(0, 34);
}
function serverAvailable(){ return !!apiUrl(); }
var HAS_SERVER = serverAvailable();

/** Apps Script API 호출: POST text/plain (CORS 프리플라이트 회피) */
function serverCall(fn, args){
  var url = apiUrl();
  if (!url) {
    return Promise.reject(new Error('서버 주소가 설정되지 않았습니다. [서버 주소 설정]에서 Apps Script 웹앱 주소를 넣어 주세요.'));
  }
  args = args || [];
  var body = { action: fn, args: args };
  body.pin = args[0];
  if (fn === 'quickUpdate') {
    body.idKey = args[1];
    body.patch = args[2];
  } else if (args.length > 1) {
    body.payload = args[1];
  }

  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow',
    cache: 'no-store'
  }).then(function(res){
    return res.text();
  }).then(function(text){
    var data = null;
    try { data = JSON.parse(text); } catch (e) {
      throw new Error('서버 응답을 읽지 못했어요. 웹앱 주소와 배포 상태를 확인해 주세요.');
    }
    if (!data || data.ok !== true) {
      throw new Error((data && data.error) ? data.error : '서버에서 오류가 돌아왔어요.');
    }
    return data;
  }).catch(function(err){
    var msg = (err && err.message) ? err.message : String(err);
    if (/Failed to fetch|NetworkError|Load failed|Network request failed|fetch failed|HTTP \d{3}/i.test(msg)) {
      throw new Error('서버에 연결하지 못했어요. 인터넷 연결과 [서버 주소 설정]의 주소, 배포 액세스(모든 사용자)를 확인해 주세요.');
    }
    throw new Error(msg);
  });
}

      return { ok: true, idKey: idKey, orders: orders };

function orderDate(o){ return o.visitDate || o.contractDate || o.receivedAt || ''; }
function revenueDate(o){ return o.contractDate || o.visitDate || o.receivedAt || ''; }
function createSortKey(o){ return (o.receivedAt || '') + ' ' + (o.savedAt || ''); }

function sumAmount(list){
  return list.reduce(function(s, o){ return s + (o.status === '취소' ? 0 : Number(o.amount || 0)); }, 0);
}
function revenueBetween(from, to){
  return state.orders.reduce(function(s, o){
    var d = revenueDate(o);
    if (o.status !== '완료') return s;
    if (from && d < from) return s;
    if (to && d > to) return s;
    return s + Number(o.amount || 0);
  }, 0);
}
function monthRevenue(month){
  return revenueBetween(month + '-01', month + '-31');
}
function dueTotal(){
  return state.orders.reduce(function(s, o){
    return (o.payment === '미수' && o.status !== '취소') ? s + Number(o.amount || 0) : s;
  }, 0);
}
function dueCount(){
  return state.orders.filter(function(o){ return o.payment === '미수' && o.status !== '취소'; }).length;
}
function countStatus(s){
  return state.orders.filter(function(o){ return o.status === s; }).length;
}
function weekStart(today){
  var d = parseYmd(today);
  var shift = (d.getDay() + 6) % 7; // 월요일 시작
  return ymd(addDays(d, -shift));
}
function monthAdd(month, delta){
  var p = month.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}

function allCustomers(){
  var map = {};
  var list = [];
  state.orders.forEach(function(o){
    var key = (o.name || '이름없음') + '|' + (digits(o.phone1) || digits(o.phone2));
    if (!map[key]) {
      map[key] = { key: key, name: o.name || '이름없음', phone1: o.phone1 || '', phone2: o.phone2 || '',
                   address: '', orders: [], total: 0, due: 0 };
      list.push(map[key]);
    }
    var c = map[key];
    c.orders.push(o);
    if (o.status !== '취소') c.total += Number(o.amount || 0);
    if (o.payment === '미수' && o.status !== '취소') c.due += Number(o.amount || 0);
    if (!c.address && o.address) c.address = o.address;
    if (!c.phone1 && o.phone1) c.phone1 = o.phone1;
    if (!c.phone2 && o.phone2) c.phone2 = o.phone2;
  });
  list.forEach(function(c){
    c.orders.sort(function(a, b){ return orderDate(b).localeCompare(orderDate(a)) || createSortKey(b).localeCompare(createSortKey(a)); });
    c.latest = c.orders[0];
    c.status = c.latest ? c.latest.status : '';
    c.visits = c.orders.length;
    var dates = c.orders.map(orderDate).filter(Boolean).sort();
    c.firstDate = dates[0] || '';
    c.lastDate = dates[dates.length - 1] || '';
  });
  list.sort(function(a, b){ return (b.lastDate || '').localeCompare(a.lastDate || ''); });
  return list;
}
function customerByKey(key){
  var list = allCustomers();
  for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
  return null;
}
function isChosungOnly(q){
  var hit = false;
  for (var i = 0; i < q.length; i++) {
    var ch = q.charAt(i);
    if (ch === ' ') continue;
    if (CHO.indexOf(ch) < 0) return false;
    hit = true;
  }
  return hit;
}
function matchesQuery(c, q){
  if (!q) return true;
  q = q.trim();
  if (!q) return true;

  var re = chosungRegex(q);
  // 1) 이름 · 모델명 · 상담유형에서 먼저 찾기 (초성 검색의 핵심)
  var nameText = c.name + ' ' + c.orders.map(function(o){ return [o.model, o.category].join(' '); }).join(' ');
  if (re.test(nameText)) return true;

  // 2) 전화번호 뒷자리
  var dq = digits(q);
  if (dq && digits(c.phone1 + ' ' + c.phone2).indexOf(dq) >= 0) return true;

  // 순수 초성 검색은 여기까지만 (주소·상담내용까지 훑으면 엉뚱한 결과가 섞임)
  if (isChosungOnly(q)) return false;

  // 3) 주소 · 상담내용 · 결과 · 메모
  var rest = [c.address]
    .concat(c.orders.map(function(o){ return [o.consult, o.result, o.memo, o.owner, o.model, o.category].join(' '); }))
    .join(' ');
  if (re.test(rest)) return true;
  if (dq && digits(rest).indexOf(dq) >= 0) return true;
  return false;
}
function customerMatchesStatus(c, f){
  if (f === 'all') return true;
  if (f === '미수') return c.due > 0;
  return c.orders.some(function(o){ return o.status === f; });
}
function filteredCustomers(){
  var q = state.query, f = state.statusFilter, ow = state.ownerFilter;
  return allCustomers().filter(function(c){
    if (!customerMatchesStatus(c, f)) return false;
    if (ow !== 'all' && !c.orders.some(function(o){ return o.owner === ow; })) return false;
    if (!matchesQuery(c, q)) return false;
    return true;
  });
}

function deltaLine(cur, prev, label){
  var diff = cur - prev;
  if (!prev && !cur) return '<span class="k-sub">' + label + ' 기록 없음</span>';
  var cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : '');
  var sign = diff > 0 ? '+' : (diff < 0 ? '−' : '');
  var txt = diff === 0 ? '변동 없음' : (label + ' ' + sign + Math.abs(diff).toLocaleString('ko-KR') + '원');
  var arrow = diff > 0 ? icon('upRight', 12) : (diff < 0 ? icon('trend', 12) : '');
  return '<span class="k-sub ' + cls + '">' + arrow + txt + '</span>';
}

          '<div class="k-val num">' + monthTotal.toLocaleString('ko-KR') + '<small>원</small></div>' +
          deltaLine(monthTotal, prevMonthRevenue, '지난달보다') + '</div>';
  html += '<div class="kpi due"><div class="k-top"><span class="k-label">미수금</span><span class="k-ic">' + icon('alert', 15) + '</span></div>' +
          '<div class="k-val num">' + due.toLocaleString('ko-KR') + '<small>원</small></div>' +
          '<span class="k-sub">' + (dueN ? dueN + '건 정산 필요 · 이번 주 방문 ' + weekVisits.length + '건' : '미수 없음') + '</span></div>';
  html += '</div>';

  // 다가오는 방문
  var upcoming = state.orders.filter(function(o){ return o.visitDate && o.visitDate >= today && o.status !== '취소'; })
    .sort(function(a, b){ return a.visitDate.localeCompare(b.visitDate); }).slice(0, 6);

  html += '<section class="card card-pad">';
  html += '<div class="sec-head" style="margin-bottom:8px"><div class="sec-title">다가오는 방문 <span class="n">' + upcoming.length + '</span></div>' +
          '<button class="link-more" data-act="nav" data-view="schedule">일정 보기 ' + icon('chevronRight', 13) + '</button></div>';
  if (!upcoming.length) {
    html += emptyBox('calendar', '예정된 방문이 없어요', '일정 탭에서 방문예정일을 등록해 보세요');
  } else {
    upcoming.forEach(function(o){
      var isToday = o.visitDate === today;
      html += '<div class="visit' + (isToday ? ' today' : '') + '">';
      html += '<div class="date-chip"><span class="d">' + Number(o.visitDate.slice(8, 10)) + '</span><span class="w">' + weekOf(o.visitDate) + '</span></div>';
      html += '<div class="grow" style="min-width:0">';
      html += '<div class="v-name">' + esc(o.name) + ' ' + calPill(o.calendar) + '</div>';
      html += '<div class="v-meta"><span class="truncate">' + esc(o.category || '상담') +
              (o.model ? ' <i class="sep"></i> ' + esc(o.model) : '') +
              ' <i class="sep"></i> ' + relLabel(o.visitDate) + '</span></div>';
      html += '</div>';
      html += '<button class="iconbtn primary" data-act="sms" data-id="' + esc(o.idKey) + '" aria-label="방문안내 문자">' + icon('message', 16) + '</button>';
      html += '</div>';
    });
  }
  html += '</section>';

  // 담당자별 + 최근 접수
  var owners = state.menu.owner || ['로보', '뚝딱'];
  html += '<div class="dash-two">';
  html += '<section class="card card-pad"><div class="between" style="margin-bottom:10px"><div class="sec-title">담당자별 현황</div><span class="tiny muted">이번 달</span></div>';
  owners.forEach(function(ow, i){
    var mine = state.orders.filter(function(o){ return o.owner === ow; });
    var activeN = mine.filter(function(o){ return o.status === '대기' || o.status === '진행중'; }).length;
    var doneN = mine.filter(function(o){ return o.status === '완료' && (o.contractDate || '').slice(0, 7) === month; }).length;
    var amt = mine.reduce(function(s, o){ return (o.status === '완료' && (o.contractDate || '').slice(0, 7) === month) ? s + Number(o.amount || 0) : s; }, 0);
    html += '<div class="team-card">';
    html += '<div class="avatar sm ' + avatarClass(ow) + '">' + initial(ow) + '</div>';
    html += '<div class="grow" style="min-width:0"><div class="t-name">' + esc(ow) + '</div>' +
            '<div class="t-meta">진행 ' + activeN + '건 · 완료 ' + doneN + '건</div></div>';
    html += '<div><div class="t-amt num">' + won(amt) + '</div><div class="t-amtl">이번 달 매출</div></div>';
    html += '</div>';
  });
  if (!owners.length) html += emptyBox('users', '등록된 담당자가 없어요', '메뉴 시트의 등록인 열을 확인해 주세요');
  html += '</section>';

  var recent = state.orders.slice().sort(function(a, b){ return createSortKey(b).localeCompare(createSortKey(a)); }).slice(0, 5);
  html += '<section class="card card-pad"><div class="sec-head" style="margin-bottom:8px"><div class="sec-title">최근 접수</div>' +
          '<button class="link-more" data-act="nav" data-view="customers">전체 보기 ' + icon('chevronRight', 13) + '</button></div>';
  if (!recent.length) {
    html += emptyBox('doc', '접수 내역이 없어요', '오른쪽 아래 + 버튼으로 새 접수를 등록하세요');
  } else {
    recent.forEach(function(o){
      html += '<button class="list-row" data-act="openCustomer" data-key="' + esc((o.name || '') + '|' + (digits(o.phone1) || digits(o.phone2))) + '">';
      html += '<div class="avatar sm ' + avatarClass(o.name) + '">' + initial(o.name) + '</div>';
      html += '<div class="grow" style="min-width:0"><div class="lr-t truncate">' + esc(o.name) + ' <span class="muted" style="font-weight:600">· ' + esc(o.category || '상담') + '</span></div>' +
              '<div class="lr-s truncate">' + dateLabel(o.receivedAt) + (o.model ? ' · ' + esc(o.model) : '') + '</div></div>';
      html += '<div style="text-align:right;flex:0 0 auto"><div class="lr-t num" style="font-size:12.5px">' + (o.amount ? won(o.amount) : '—') + '</div>' +
              '<div style="margin-top:3px">' + statusPill(o.status) + '</div></div>';
      html += '</button>';
    });
  }
  html += '</section>';
  html += '</div>';

  // 월별 매출
  var months = [];
  for (var i = 5; i >= 0; i--) months.push(monthAdd(month, -i));
  var vals = months.map(function(m){ return monthRevenue(m); });
  var maxV = Math.max.apply(null, vals.concat([1]));
  html += '<section class="card card-pad"><div class="between" style="margin-bottom:10px"><div class="sec-title">월별 매출</div><span class="tiny muted">최근 6개월 · 완료 기준</span></div>';
  html += '<div class="hbar">';
  months.forEach(function(m, idx){
    var v = vals[idx];
    var w = Math.max(0, Math.round(v / maxV * 100));
    var now = idx === months.length - 1;
    html += '<div class="hbar-row"><span class="hbar-m">' + Number(m.slice(5, 7)) + '월</span>' +
            '<div class="hbar-track"><i class="' + (now ? 'now' : '') + '" style="width:' + (v ? Math.max(4, w) : 0) + '%"></i></div>' +
            '<span class="hbar-v' + (v ? '' : ' zero') + '">' + (v ? wonShort(v) + '원' : '—') + '</span></div>';
  });
  html += '</div></section>';

  return html;
}

function emptyBox(ic, title, sub){
  return '<div class="empty"><div class="ic">' + icon(ic, 22) + '</div><div class="t">' + title + '</div><div class="s">' + (sub || '') + '</div></div>';
}

/* ==========================================================
   7. 고객
   ========================================================== */
function statusChips(){
  var counts = { all: 0, '대기': 0, '진행중': 0, '완료': 0, '미수': 0 };
  var list = allCustomers();
  list.forEach(function(c){
    if (state.ownerFilter !== 'all' && !c.orders.some(function(o){ return o.owner === state.ownerFilter; })) return;
    counts.all++;
    ['대기', '진행중', '완료'].forEach(function(s){
      if (c.orders.some(function(o){ return o.status === s; })) counts[s]++;
    });
    if (c.due > 0) counts['미수']++;
  });
  var items = [['all', '전체'], ['대기', '대기'], ['진행중', '진행중'], ['완료', '완료'], ['미수', '미수']];
  return items.map(function(it){
    return '<button class="chip' + (state.statusFilter === it[0] ? ' active' : '') + '" data-act="statusFilter" data-val="' + it[0] + '">' +
      it[1] + ' <span class="cnt">' + (counts[it[0]] || 0) + '</span></button>';
  }).join('');
}

function renderCustomers(){
  var total = allCustomers();
  var totalOrders = state.orders.length;
  var html = '';
  html += '<div class="page-head"><div class="page-title">고객</div>' +
          '<div class="page-sub">고객 ' + total.length + '명 · 접수 ' + totalOrders + '건 · 이름·초성·전화 뒷자리로 검색</div></div>';

  html += '<div class="search">' + icon('search', 17, 'muted') +
          '<input id="custSearch" type="search" placeholder="이름, 초성(ㄱㅈㅅ), 전화번호, 모델명, 주소" value="' + esc(state.query) + '" autocomplete="off">' +
          (state.query ? '<button class="clear" data-act="clearQuery" aria-label="검색어 지우기">' + icon('x', 13) + '</button>' : '') +
          '</div>';

  html += '<div class="chips" id="statusChips">' + statusChips() + '</div>';

  var owners = ['all'].concat(state.menu.owner || []);
  html += '<div class="between" style="gap:8px">';
  html += '<div class="seg" id="ownerSeg">' + owners.map(function(ow){
    return '<button class="' + (state.ownerFilter === ow ? 'active' : '') + '" data-act="ownerFilter" data-val="' + esc(ow) + '">' +
      (ow === 'all' ? '전체 담당' : esc(ow)) + '</button>';
  }).join('') + '</div>';
  html += '<div class="seg" id="modeSeg">' +
          '<button class="' + (state.viewMode === 'list' ? 'active' : '') + '" data-act="viewMode" data-val="list">' + icon('list', 13) + '목록</button>' +
          '<button class="' + (state.viewMode === 'board' ? 'active' : '') + '" data-act="viewMode" data-val="board">' + icon('columns', 13) + '보드</button>' +
          '</div>';
  html += '</div>';

  html += '<div id="custResults">' + renderCustomerResults() + '</div>';
  return html;
}

function renderCustomerResults(){
  var list = filteredCustomers();
  if (!list.length) {
    return emptyBox('search', '조건에 맞는 고객이 없어요', state.query ? '다른 검색어로 찾아보세요' : '새 접수를 등록하면 고객이 자동으로 쌓입니다');

        html += '<button class="bcard" data-act="openCustomer" data-key="' + esc(c.key) + '">';

                '<span class="avatar sm ' + avatarClass(c.name) + '" style="width:24px;height:24px;font-size:10px">' + initial(c.name) + '</span></div>';
        html += '<div class="b-sub truncate">' + esc(c.latest && c.latest.category || '상담') +
                (c.latest && c.latest.model ? ' · ' + esc(c.latest.model) : '') + '</div>';
        html += '<div class="b-foot"><span class="b-amt num">' + (c.total ? won(c.total) : '—') + '</span>' +
                '<span class="b-date">' + (c.lastDate ? dateLabel(c.lastDate) : '') + ' · ' + c.visits + '건</span></div>';

      });

  var out = '<div class="cust-list">';

    var latest = c.latest || {};
    out += '<button class="cust" data-act="openCustomer" data-key="' + esc(c.key) + '">';
    out += '<div class="avatar ' + avatarClass(c.name) + '">' + initial(c.name) + '</div>';

    out += '<div class="c-meta"><span class="truncate">' + esc(c.phone1 || '전화 없음') +
           (latest.category ? ' <i class="sep"></i> ' + esc(latest.category) : '') +
           (latest.model ? ' <i class="sep"></i> ' + esc(latest.model) : '') + '</span></div>';
    out += '</div>';
    out += '<div class="c-right"><div class="c-amt num">' + (c.total ? won(c.total) : '—') + '</div>' +
           '<div class="c-when">' + c.visits + '건 · ' + (c.lastDate ? dateLabel(c.lastDate) : '') + '</div></div>';
    out += '<span class="muted" style="opacity:.55">' + icon('chevronRight', 16) + '</span>';
    out += '</button>';
  });
  out += '</div>';
  return out;
}

/* ==========================================================
   8. 일정
   ========================================================== */
function renderSchedule(){
  var today = todayStr();
  var month = state.calMonth || today.slice(0, 7);
  var p = month.split('-');
  var y = Number(p[0]), m = Number(p[1]);
  var first = new Date(y, m - 1, 1);
  var startOffset = first.getDay();
  var totalDays = new Date(y, m, 0).getDate();
  var rows = Math.ceil((startOffset + totalDays) / 7);
  var cells = rows * 7;

  var byDate = {};
  state.orders.forEach(function(o){
    if (!o.visitDate) return;
    if (!byDate[o.visitDate]) byDate[o.visitDate] = [];
    byDate[o.visitDate].push(o);
  });

  var monthVisits = state.orders.filter(function(o){ return (o.visitDate || '').slice(0, 7) === month && o.status !== '취소'; });
  var monthDone = monthVisits.filter(function(o){ return o.calendar === '방문완료'; }).length;

  var html = '';
  html += '<div class="page-head"><div class="page-title">일정</div>' +
          '<div class="page-sub">' + monthLabel(month) + ' 방문 ' + monthVisits.length + '건 · 방문완료 ' + monthDone + '건</div></div>';

  html += '<section class="card cal-card">';
  html += '<div class="cal-head"><div class="cal-month">' + y + '년 ' + m + '월 <small>' + monthVisits.length + '건</small></div>';
  html += '<div class="row gap6">' +
          '<button class="iconbtn" data-act="calMonth" data-delta="-1" aria-label="이전 달">' + icon('chevronLeft', 16) + '</button>' +
          '<button class="btn btn-sm" data-act="calToday">오늘</button>' +
          '<button class="iconbtn" data-act="calMonth" data-delta="1" aria-label="다음 달">' + icon('chevronRight', 16) + '</button>' +
          '</div></div>';
  html += '<div class="cal-dow">' + WEEK.map(function(w){ return '<span>' + w + '</span>'; }).join('') + '</div>';
  html += '<div class="cal-grid">';
  for (var i = 0; i < cells; i++) {
    var dayNum = i - startOffset + 1;
    var dt = new Date(y, m - 1, dayNum);
    var ds = ymd(dt);
    var outside = dt.getMonth() !== m - 1;
    var list = byDate[ds] || [];
    var cls = 'cal-day';
    if (outside) cls += ' out';
    if (dt.getDay() === 0) cls += ' sun';
    if (dt.getDay() === 6) cls += ' sat';
    if (ds === today) cls += ' today';
    if (ds === state.selDate) cls += ' sel';
    html += '<button class="' + cls + '" data-act="pickDay" data-date="' + ds + '">';
    html += '<span class="dn">' + dt.getDate() + '</span>';
    if (list.length > 3) {
      html += '<span class="cnt">' + list.length + '</span>';
    }
    html += '<span class="dots">';
    list.slice(0, 3).forEach(function(o){
      html += '<i class="s-' + statusMeta(o.status).cls + '"></i>';
    });
    html += '</span></button>';
  }
  html += '</div>';
  html += '<div class="cal-legend">' +
          '<span><i style="background:var(--wait)"></i>대기</span>' +
          '<span><i style="background:var(--prog)"></i>진행중</span>' +
          '<span><i style="background:var(--done)"></i>완료</span>' +
          '<span><i style="background:var(--cancel)"></i>취소</span>' +
          '</div>';
  html += '</section>';

  var sel = state.selDate || today;
  var dayOrders = (byDate[sel] || []).slice().sort(function(a, b){ return (a.owner || '').localeCompare(b.owner || ''); });
  html += '<div class="sec-head" style="margin-top:2px"><div class="sec-title">' + dateLong(sel) +
          ' <span class="n">' + dayOrders.length + '건</span></div>' +
          (sel !== today ? '<button class="link-more" data-act="calToday">오늘로</button>' : '') + '</div>';

  if (!dayOrders.length) {
    html += '<section class="card">' + emptyBox('calendar', '이 날은 방문 일정이 없어요', '다른 날짜를 선택하거나 새 접수로 방문일을 등록하세요') + '</section>';
  } else {
    html += '<div class="visit-sched">';
    dayOrders.forEach(function(o){
      html += '<div class="vs-card">';
      html += '<div class="vs-top">';
      html += '<div class="avatar ' + avatarClass(o.name) + '">' + initial(o.name) + '</div>';
      html += '<div class="grow" style="min-width:0">';
      html += '<div class="vs-name">' + esc(o.name) + ' ' + statusPill(o.status) + '</div>';
      html += '<div class="vs-sub truncate">' + esc(o.category || '상담') + (o.model ? ' · ' + esc(o.model) : '') + '</div>';
      html += '<div class="vs-sub truncate" style="margin-top:3px">' + icon('pin', 12) + ' ' + esc(o.address || '주소 없음') + '</div>';
      html += '</div>';
      html += '<div class="avatar sm ' + avatarClass(o.owner) + '" title="담당 ' + esc(o.owner) + '">' + initial(o.owner) + '</div>';
      html += '</div>';
      html += '<div class="vs-steps">' + ['캘린더등록', '미방문', '방문완료', '등록완료'].map(function(v){
        return '<button data-act="setCal" data-id="' + esc(o.idKey) + '" data-val="' + v + '" data-cal="' + v + '" class="' + (o.calendar === v ? 'active' : '') + '">' + v + '</button>';
      }).join('') + '</div>';
      html += '<div class="row gap6">';
      html += '<button class="btn btn-sm grow" data-act="openCustomer" data-key="' + esc((o.name || '') + '|' + (digits(o.phone1) || digits(o.phone2))) + '">상세 보기</button>';
      html += '<button class="btn btn-sm btn-soft" data-act="sms" data-id="' + esc(o.idKey) + '">' + icon('message', 14) + '문자</button>';
      html += '<a class="btn btn-sm btn-icon" href="tel:' + esc(digits(o.phone1)) + '" aria-label="전화">' + icon('phone', 15) + '</a>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  }
  return html;
}

/* ==========================================================
   9. 정산
   ========================================================== */
function renderSettlement(){
  var month = state.stMonth || todayStr().slice(0, 7);
  var rows = state.settlements.filter(function(s){ return (s.date || '').slice(0, 7) === month; });
  var expenses = state.expenses.filter(function(e){ return (e.date || '').slice(0, 7) === month; });

  var t = { total: 0, robocom: 0, ttukddak: 0, cost: 0, deduct: 0 };
  rows.forEach(function(s){
    t.total += Number(s.total || 0); t.robocom += Number(s.robocom || 0);
    t.ttukddak += Number(s.ttukddak || 0); t.cost += Number(s.cost || 0); t.deduct += Number(s.deduct || 0);
  });
  var expenseTotal = expenses.reduce(function(a, e){ return a + Number(e.amount || 0); }, 0);

  var html = '';
  html += '<div class="page-head"><div class="page-title">정산</div>' +
          '<div class="page-sub">' + monthLabel(month) + ' 정산 ' + rows.length + '건 · 총 수금 ' + won(t.total) + '</div></div>';

  html += '<div class="between"><div class="seg">' +
          '<button class="' + (state.stTab === 'settle' ? 'active' : '') + '" data-act="stTab" data-val="settle">정산 내역</button>' +
          '<button class="' + (state.stTab === 'expense' ? 'active' : '') + '" data-act="stTab" data-val="expense">비용·지출</button>' +
          '</div><div class="row gap6">' +
          '<button class="iconbtn" data-act="stMonth" data-delta="-1" aria-label="이전 달">' + icon('chevronLeft', 16) + '</button>' +
          '<button class="btn btn-sm" data-act="stMonth" data-delta="0">' + Number(month.slice(5, 7)) + '월</button>' +
          '<button class="iconbtn" data-act="stMonth" data-delta="1" aria-label="다음 달">' + icon('chevronRight', 16) + '</button>' +
          '</div></div>';

  if (state.stTab === 'expense') {
    html += '<div class="money-grid">';
    html += '<div class="money hero-money"><div class="l">' + icon('wallet', 13) + ' 이번 달 비용 합계</div><div class="v num">' + won(expenseTotal) + '</div></div>';
    html += '<div class="money"><div class="l">지출 건수</div><div class="v num">' + expenses.length + '<small>건</small></div></div>';
    html += '<div class="money"><div class="l">정산 금액</div><div class="v num">' + won(t.total) + '</div></div>';
    html += '</div>';
    if (!expenses.length) {
      html += '<section class="card">' + emptyBox('wallet', '이 달 지출 내역이 없어요', '정산 시트의 오른쪽 지출 영역에 기록됩니다') + '</section>';
    } else {
      html += '<div class="st-list">';
      expenses.slice().sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); }).forEach(function(e){
        html += '<div class="exp-row"><div class="e-date">' + dateLabel(e.date) + '</div>' +
                '<div class="grow" style="min-width:0"><div class="e-item truncate">' + esc(e.item || '지출') + '</div>' +

      if (s.note) extra.push(esc(s.note));
      if (extra.length) html += '<div class="st-meta"><span class="lbl">' + extra.join(' · ') + '</span></div>';
      html += '</div>';
    });
    html += '</div>';
  }
  return html;
}

function saveOrderForm(form){
  var data = {};
  ['idKey', 'receivedAt', 'visitDate', 'status', 'calendar', 'name', 'owner', 'phone1', 'phone2',
   'address', 'category', 'consult', 'result', 'model', 'payment', 'source', 'memo', 'contractDate'
  ].forEach(function(k){
    var el = form.elements[k];
    data[k] = el ? String(el.value || '').trim() : '';
  });
  data.amount = numVal(form.elements.amount ? form.elements.amount.value : 0);
  data.cost = numVal(form.elements.cost ? form.elements.cost.value : 0);

  if (!data.name) {
    toast('고객 이름을 입력해 주세요', true);
    if (form.elements.name) form.elements.name.focus();
    return;
  }
  if (data.visitDate && !data.calendar) data.calendar = '캘린더등록';

  var btn = document.getElementById('orderSaveBtn');
  var isEdit = !!data.idKey;
  if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }

  var p = isEdit ? api.updateOrder(state.pin, data) : api.createOrder(state.pin, data);
  p.then(function(res){
    if (res && res.orders) state.orders = res.orders;
    closeOrderModal();
    render();
    if (state.openKey) refreshDrawer();
    toast(isEdit ? '접수를 수정했어요' : '새 접수를 등록했어요');
  }).catch(function(err){
    toast(err.message || '저장에 실패했어요', true);
    if (btn) { btn.disabled = false; btn.textContent = isEdit ? '수정 저장' : '접수 등록'; }
  });
}

function templateVars(o){
  return {
    '{고객명}': o.name || '고객',
    '{방문일}': o.visitDate ? dateLong(o.visitDate) : '미정',
    '{모델명}': o.model || '—',
    '{금액}': o.amount ? won(o.amount) : '—',
    '{상담}': o.category || '상담',
    '{상태}': o.status || '',
    '{결과}': o.result || '요청하신 작업 완료',
    '{결제방식}': o.payment || '—',
    '{담당자}': o.owner || state.companyName,
    '{업체명}': state.companyName || '로보컴'
  };
}
function fillTemplate(body, o){
  var vars = templateVars(o);
  var out = body;
  Object.keys(vars).forEach(function(k){
    out = out.split(k).join(vars[k]);
  });
  return out;
}
function smsHref(phone, text){
  var num = digits(phone);
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  // iOS는 &body=, 안드로이드는 ?&body= 형식을 사용합니다
  return 'sms:' + (num || '') + (isIOS ? '&body=' : '?&body=') + encodeURIComponent(text);
}
function byteLength(s){
  var n = 0;
  for (var i = 0; i < s.length; i++) n += s.charCodeAt(i) > 127 ? 2 : 1;
  return n;
}
function defaultTemplateFor(o){
  if (o.status === '완료' || (o.contractDate && o.status !== '진행중')) return 'done';
  if (o.visitDate === todayStr()) return 'onsite';
  return 'confirm';
}

  smsState.orderId = orderId;

  var tpls = state.smsTemplates.length ? state.smsTemplates : MOCK_SMS_TEMPLATES;

  smsState.text = fillTemplate(tpl.body, o);

  var html = '<div class="sheet" style="max-width:560px">';

  html += '<div class="sheet-body">';
  html += '<div class="sms-templates">';
  tpls.forEach(function(t, i){
    html += '<button class="sms-tpl' + (t.id === smsState.tplId ? ' active' : '') + '" data-act="smsTpl" data-id="' + esc(t.id) + '">' +

  html += '</div>';

          ['{고객명}', '{방문일}', '{모델명}', '{금액}', '{상담}', '{결과}', '{담당자}'].map(function(v){

          }).join('') + '</div>';

  html += '</div>';
  var canSend = !!digits(o.phone1);
  html += '<div class="sheet-foot">' +
          '<button class="btn" data-act="copySms">' + icon('copy', 15) + '문구 복사</button>' +
          '<a class="btn btn-primary" id="smsSendBtn" href="' + smsHref(o.phone1, smsState.text) + '"' +
          (canSend ? '' : ' aria-disabled="true" style="opacity:.5;pointer-events:none"') + '>' + icon('send', 15) +
          (canSend ? '문자 보내기' : '전화번호 없음') + '</a>' +

}
function closeSmsModal(){
  document.getElementById('smsModal').classList.remove('show');
  if (!document.querySelector('.drawer.show') && !document.querySelector('.modal-wrap.show')) lockScroll(false);
}
function updateSmsText(val){
  smsState.text = val;
  var len = document.getElementById('smsLen');
  if (len) len.textContent = byteLength(val) + ' byte';
  var o = null;
  state.orders.forEach(function(x){ if (x.idKey === smsState.orderId) o = x; });
  var btn = document.getElementById('smsSendBtn');
  if (btn && o) btn.setAttribute('href', smsHref(o.phone1, val));
}
function copySms(){
  var text = smsState.text || '';
  function done(){ toast('문구를 복사했어요. 문자 앱에 붙여넣으세요'); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { toast('복사에 실패했어요. 문구를 직접 선택해 주세요', true); }
    document.body.removeChild(ta);
  }
}

/** 주소로 실제 ping 호출 */
function testApiConnection(url){
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'ping' }),
    redirect: 'follow',
    cache: 'no-store'
  }).then(function(res){ return res.text(); }).then(function(text){
    var data = null;
    try { data = JSON.parse(text); } catch (e) { data = null; }
    if (!data || data.ok !== true) {
      throw new Error('주소는 열리지만 API 응답이 아닙니다. Code.gs를 새 버전으로 배포했는지 확인해 주세요.');
    }
    return data;
  }).catch(function(err){
    var msg = (err && err.message) ? err.message : String(err);
    if (/Failed to fetch|NetworkError|Load failed|Network request failed|fetch failed/i.test(msg)) {
      throw new Error('연결하지 못했습니다. 주소와 배포 액세스(모든 사용자)를 확인해 주세요.');
    }
    throw new Error(msg);
  });
}

function testApiUrl(){
  var input = document.getElementById('apiUrlInput');
  var url = normalizeApiUrl(input ? input.value : '');
  if (!isValidApiUrl(url)) {
    apiMsg('https://script.google.com/macros/s/…/exec 형식의 주소를 넣어 주세요', 'err');
    return;
  }
  apiMsg('연결을 확인하는 중…', 'wait');
  testApiConnection(url).then(function(res){
    apiMsg('연결되었습니다. (서버 v' + (res.version || '?') + ')', 'ok');
  }).catch(function(err){
    apiMsg(err.message || '연결하지 못했습니다', 'err');
  });
}
